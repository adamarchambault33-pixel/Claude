<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arch · Statement Engine</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --line: #2a2f3a;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #d97a4e;        /* terracotta */
      --accent-soft: #2a1f19;
      --good: #4ea36b;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font); line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    header .logo {
      font-weight: 700; font-size: 22px; letter-spacing: .5px;
      color: var(--accent);
    }
    header .sub { color: var(--muted); font-size: 14px; }
    h1 { font-size: 28px; margin: 18px 0 6px; font-weight: 650; }
    .lede { color: var(--muted); margin: 0 0 28px; }

    .drop {
      border: 1.5px dashed var(--line); border-radius: var(--radius);
      background: var(--panel); padding: 44px 24px; text-align: center;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--panel-2); }
    .drop .icon { font-size: 34px; }
    .drop .big { font-size: 16px; margin-top: 10px; }
    .drop .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .drop .file { color: var(--accent); font-weight: 600; }
    input[type=file] { display: none; }

    .row { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 10px;
      padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: var(--font);
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }

    .status { margin-top: 22px; color: var(--muted); font-size: 14px; min-height: 20px; }
    .status.err { color: #e07a6b; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: 8px;
      border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px; margin-top: 26px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
    .card .v { font-size: 20px; font-weight: 650; margin-top: 4px; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }

    .jsonhead { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 8px; }
    .jsonhead h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: .4px; }
    pre {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px; overflow: auto; font-size: 13px; line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #cdd3df; max-height: 480px;
    }
    .hidden { display: none; }
    .copied { color: var(--good); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo">ARCH</span>
      <span class="sub">Statement Engine · milestone 1 (extract + structure)</span>
    </header>
    <h1>Statement &rarr; clean JSON</h1>
    <p class="lede">Drop a merchant processing statement (PDF). We pull the text and tables,
      then normalize it into structured data &mdash; works across processors (Fiserv, TSYS, Elavon, Paysafe&hellip;).</p>

    <label class="drop" id="drop">
      <div class="icon">📄</div>
      <div class="big" id="dropMain">Drag a PDF here, or click to choose</div>
      <div class="small" id="dropSub">PDF only · up to 20&nbsp;MB</div>
      <input type="file" id="file" accept="application/pdf,.pdf" />
    </label>

    <div class="row">
      <button id="go" disabled>Process statement</button>
      <button class="ghost hidden" id="reset">Clear</button>
    </div>

    <div class="status" id="status"></div>

    <div id="result" class="hidden">
      <div class="cards" id="cards"></div>
      <div class="jsonhead">
        <h2>Structured JSON</h2>
        <button class="ghost" id="copy">Copy</button>
      </div>
      <pre id="json"></pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const drop = $("drop"), fileInput = $("file"), go = $("go"), reset = $("reset");
    const status = $("status"), result = $("result"), cards = $("cards"), jsonEl = $("json"), copy = $("copy");
    let chosen = null;

    function setFile(f) {
      chosen = f;
      go.disabled = !f;
      if (f) {
        $("dropMain").innerHTML = 'Selected: <span class="file">' + f.name + '</span>';
        $("dropSub").textContent = (f.size / 1024).toFixed(0) + " KB · click to change";
        reset.classList.remove("hidden");
      }
    }

    fileInput.addEventListener("change", (e) => setFile(e.target.files[0] || null));
    ["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); drop.classList.add("over");
    }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); drop.classList.remove("over");
    }));
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });

    reset.addEventListener("click", () => {
      chosen = null; fileInput.value = ""; go.disabled = true;
      $("dropMain").textContent = "Drag a PDF here, or click to choose";
      $("dropSub").innerHTML = "PDF only · up to 20&nbsp;MB";
      reset.classList.add("hidden");
      result.classList.add("hidden"); status.textContent = ""; status.className = "status";
    });

    go.addEventListener("click", async () => {
      if (!chosen) return;
      go.disabled = true; result.classList.add("hidden");
      status.className = "status";
      status.innerHTML = '<span class="spinner"></span>Extracting and structuring &mdash; this can take 10–30s…';

      const fd = new FormData();
      fd.append("statement", chosen);
      try {
        const res = await fetch("/api/process", { method: "POST", body: fd });
        const body = await res.json();
        if (!body.ok) {
          status.className = "status err";
          status.textContent = "Error: " + body.error;
          go.disabled = false;
          return;
        }
        render(body);
      } catch (err) {
        status.className = "status err";
        status.textContent = "Request failed: " + err;
      } finally {
        go.disabled = false;
      }
    });

    const money = (n) => n == null ? "—" :
      "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const num = (n) => n == null ? "—" : Number(n).toLocaleString();

    function render(body) {
      const d = body.data;
      status.className = "status";
      status.innerHTML = 'Done · ' + body.raw_chars.toLocaleString() + ' chars extracted · model ' + body.model;

      const eff = (d.total_fees != null && d.total_volume) ?
        ((d.total_fees / d.total_volume) * 100).toFixed(2) + "%" : "—";

      cards.innerHTML = "";
      const add = (k, v) => {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
        cards.appendChild(el);
      };
      add("Merchant", d.merchant_name || "—");
      add("Period", d.statement_period || "—");
      add("Total volume", money(d.total_volume));
      add("Transactions", num(d.transaction_count));
      add("Total fees", money(d.total_fees));
      add("Effective rate", eff);
      add("Pricing model", '<span class="pill">' + (d.current_model || "unknown") + "</span>");

      jsonEl.textContent = JSON.stringify(d, null, 2);
      result.classList.remove("hidden");
    }

    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(jsonEl.textContent);
      const old = copy.textContent;
      copy.textContent = "Copied ✓"; copy.classList.add("copied");
      setTimeout(() => { copy.textContent = old; copy.classList.remove("copied"); }, 1500);
    });
  </script>
</body>
</html>
